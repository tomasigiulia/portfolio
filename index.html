<style>
    :root {
        --primary: #2c3e50;
        --accent: #27ae60;
        --secondary: #2980b9;
        --text: #333;
        --bg: #f8fafc;
        --white: #ffffff;
    }

    body {
        font-family: 'Inter', sans-serif;
        line-height: 1.7;
        color: var(--text);
        background-color: var(--bg);
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 1200px; /* Leggermente più largo per dare respiro */
        margin: 0 auto;
        padding: 40px 20px;
    }

    /* ===== PROFILO ===== */
    #profilo {
        background: var(--white);
        padding: 50px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        display: grid;
        grid-template-columns: 320px 1fr; /* Foto profilo più grande */
        gap: 50px;
        align-items: center;
        margin-bottom: 80px;
    }

    #profilo img {
        width: 100%;
        border-radius: 20px;
        object-fit: cover;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    /* ===== GRID VISUAL (MIGLIORATA) ===== */
    .grid-visual {
        display: grid;
        /* Su desktop usiamo 2 colonne per le mappe per vederle GRANDI */
        grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); 
        gap: 35px;
        margin-bottom: 40px;
    }

    /* Per la fotografia macro, possiamo tenere 3 colonne o 2 */
    .grid-macro {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 25px;
    }

    .card {
        background: var(--white);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        display: flex;
        flex-direction: column;
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .card-img-container {
        overflow: hidden;
        background: #f1f5f9;
    }

    .card img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.6s ease;
    }

    .card:hover img {
        transform: scale(1.03);
    }

    .card-content {
        padding: 20px;
        background: white;
    }

    .caption {
        font-size: 1rem;
        color: var(--primary);
        text-align: center;
        margin: 0;
        font-weight: 500;
    }

    /* Immagine singola grande (Ato Baldo) */
    .full-width-card {
        width: 100%;
        margin-top: 35px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
        #profilo { grid-template-columns: 1fr; text-align: center; padding: 30px; }
        #profilo img { width: 250px; margin: 0 auto; }
        .grid-visual, .grid-macro { grid-template-columns: 1fr; }
        .container { padding: 20px 15px; }
    }
</style>

<h2 class="section-title">Elaborazioni GIS & Analisi Dati</h2>
<section>
    <div class="grid-visual">
        <div class="card">
            <div class="card-img-container">
                <img src="images/e_sumatrensis.gif" alt="Erigeron sumatrensis">
            </div>
            <div class="card-content">
                <p class="caption">Espansione di <i>Erigeron sumatrensis</i> in Trentino</p>
            </div>
        </div>
        
        <div class="card">
            <div class="card-img-container">
                <img src="images/Androsace_alpina.jpg" alt="Androsace alpina">
            </div>
            <div class="card-content">
                <p class="caption">Mappa distributiva <i>Androsace alpina</i></p>
            </div>
        </div>
    </div>

    <div class="card full-width-card">
        <div class="card-img-container">
            <img src="images/ato_baldo.jpg" alt="Ato Baldo">
        </div>
        <div class="card-content">
            <p class="caption">Ato Baldo – Hotspots floristici e Mappa di Concentrazione (Kernel Density)</p>
        </div>
    </div>
</section>
