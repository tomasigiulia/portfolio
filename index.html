<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcuni miei elaborati</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        h1, h2, h3 {
            color: #2c3e50;
        }

        section {
            margin-bottom: 50px;
        }

        img {
            display: block;
            margin: 20px 0;
            max-width: 100%;
            height: auto;
        }

        .projects iframe {
            width: 100%;
            height: 800px; /* maggiore altezza per tour panoramico */
            border: 1px solid #ccc;
        }

        @media (max-width: 768px) {
            .projects iframe {
                height: 500px; /* ridotto su mobile */
            }
        }
    </style>
</head>
<body>

<h1>Alcuni sviluppi realizzati</h1>

<!-- SEZIONE GIS / MAPPE -->
<section id="gis">
    <h2>Elaborazioni GIS</h2>

    <p>
        Espansione di <em>Erigeron sumatrensis</em> in Trentino  
        (dati: sezione botanica FMCR):
    </p>
    <img src="images/e_sumatrensis.gif"
         alt="Espansione di Erigeron sumatrensis in Trentino">

    <p>
        Espansione di <em>Erigeron canadensis</em> in Trentino  
        (dati: sezione botanica FMCR):
    </p>
    <img src="images/e_canadensis.gif"
         alt="Espansione di Erigeron canadensis in Trentino">
</section>

<!-- SEZIONE FOTOGRAFIA / TOUR -->
<section id="fotografia">
    <h2>Fotografia / 360° Tour</h2>

    <div class="projects">
        <div>
            <h3>360° Tour</h3>
            <iframe src="https://tomasigiulia.github.io/360tour/" 
                    loading="lazy">
            </iframe>
        </div>
    </div>
</section>

</body>
</html>
