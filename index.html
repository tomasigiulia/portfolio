<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcuni miei elaborati</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        h1, h2, h3 {
            color: #2c3e50;
        }

        section {
            margin-bottom: 50px;
        }

        /* Contenitore per GIF affiancate */
        .gis-gifs {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
            align-items: flex-start; /* allinea in alto le immagini */
        }

        .gis-gifs img {
            width: 48%;       /* larghezza fissa per affiancare */
            max-width: 100%;
            height: auto;
            display: block;   /* evita spazi invisibili sotto */
        }

        /* Didascalia */
        .caption {
            text-align: center;
            font-style: italic;
            margin-top: 10px;
        }

        /* Immagine aggiuntiva */
        .gis-image {
            text-align: center;
            margin-top: 30px;
        }

        .gis-image img {
            max-width: 100%;
            height: auto;
        }

        /* Tour */
        .projects iframe {
            width: 100%;
            height: 800px; /* più panoramico su desktop */
            border: 1px solid #ccc;
        }

        @media (max-width: 768px) {
            .gis-gifs img {
                width: 100%;   /* su mobile le GIF diventano verticali */
            }
            .projects iframe {
                height: 500px; /* ridotto su mobile */
            }
        }
    </style>
</head>
<body>

<h1>Alcuni sviluppi realizzati</h1>

<!-- SEZIONE GIS / MAPPE -->
<section id="gis">
    <h2>Elaborazioni GIS</h2>

    <!-- GIF affiancate -->
    <div class="gis-gifs">
        <img src="images/e_sumatrensis.gif" alt="Espansione di Erigeron sumatrensis in Trentino">
        <img src="images/e_canadensis.gif" alt="Espansione di Erigeron canadensis in Trentino">
    </div>

    <!-- Immagine aggiuntiva con didascalia -->
    <div class="gis-image">
        <img src="images/ato_baldo.jpg" alt="Ato Baldo">
        <div class="caption">Ato Baldo - vista del territorio</div>
    </div>
</section>

<!-- SEZIONE FOTOGRAFIA / TOUR -->
<section id="fotografia">
    <h2>Fotografia / 360° Tour</h2>

    <div class="projects">
        <div>
            <h3>360° Tour</h3>
            <iframe src="https://tomasigiulia.github.io/360tour/" loading="lazy"></iframe>
        </div>
    </div>
</section>

</body>
</html>
